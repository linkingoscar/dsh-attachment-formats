name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          # pnpm 11 requires Node >=22.13 (uses node:sqlite); keep Node 20 compat on 10.x
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build:client
      # 产物新鲜度门禁：构建后 lib/client.js 必须与提交一致（防"改 src 忘 build"）
      - run: pnpm run verify:build
      - run: pnpm run smoke:all
